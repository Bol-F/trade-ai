name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tradegraph-ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Backend lint
        run: uv run ruff check .
      - name: Backend type check
        run: uv run mypy apps/backend packages/data_pipeline/src packages/ml/src
      - name: Backend tests
        run: uv run pytest apps/backend/tests --cov=apps/backend --cov-report=term-missing
      - name: Pipeline tests
        run: uv run pytest packages/data_pipeline/tests
      - name: ML tests
        run: uv run pytest packages/ml/tests
      - name: Migration consistency
        run: uv run python apps/backend/manage.py makemigrations --check --settings=config.settings.test
      - name: Secret scan
        run: uv run python scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tradegraph-ai/apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tradegraph-ai/apps/frontend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend format check
        run: npm run format:check
      - name: Frontend lint
        run: npm run lint
      - name: Frontend type check
        run: npm run typecheck
      - name: Frontend tests
        run: npm test -- --run
      - name: Frontend build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tradegraph-ai
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile .
      - name: Build frontend image
        run: docker build apps/frontend

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradegraph-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Backend lint
        run: uv run ruff check .
      - name: Backend type check
        run: uv run mypy apps/backend packages/data_pipeline/src packages/ml/src
      - name: Backend tests
        run: uv run pytest apps/backend/tests --cov=apps/backend --cov-report=term-missing
      - name: Pipeline tests
        run: uv run pytest packages/data_pipeline/tests
      - name: ML tests
        run: uv run pytest packages/ml/tests
      - name: Migration consistency
        run: uv run python apps/backend/manage.py makemigrations --check --settings=config.settings.test
      - name: Secret scan
        run: uv run python scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradegraph-ai/apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tradegraph-ai/apps/frontend/package-lock.json
      - run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test -- --run
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradegraph-ai
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile .
      - name: Build frontend image
        run: docker build apps/frontend

{% load i18n %}
<form action="{% url 'set_language' %}" method="post" style="display:inline-flex;align-items:center;gap:.4rem;margin-right:1rem">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label for="admin-language">{% translate "Language" %}</label>
  <select id="admin-language" name="language" onchange="this.form.submit()">
    {% get_current_language as CURRENT_LANGUAGE %}
    {% get_available_languages as LANGUAGES %}
    {% get_language_info_list for LANGUAGES as languages %}
    {% for language in languages %}
      <option value="{{ language.code }}"{% if language.code == CURRENT_LANGUAGE %} selected{% endif %}>{{ language.name_local }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{% translate "Go" %}</button></noscript>
</form>

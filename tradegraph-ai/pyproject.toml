[project]
name = "tradegraph-ai"
version = "0.1.0"
description = "TradeGraph AI monorepo Python workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6",
  "django>=5.1,<6",
  "django-cors-headers>=4.6,<5",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "python-json-logger>=3.2,<4",
  "redis>=5.2,<6",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "django-stubs[compatible-mypy]>=5.1,<6",
  "djangorestframework-stubs[compatible-mypy]>=3.15,<4",
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["apps/backend"]
testpaths = ["apps/backend/tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
mypy_path = "apps/backend"
exclude = ["apps/frontend"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

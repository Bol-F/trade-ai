[project]
name = "tradegraph-ai"
version = "0.1.0"
description = "TradeGraph AI monorepo Python workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6",
  "django>=5.1,<6",
  "django-cors-headers>=4.6,<5",
  "django-filter>=25.1,<26",
  "djangorestframework>=3.15,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "joblib>=1.5.3",
  "polars>=1.30,<2",
  "prometheus-client>=0.25.0",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<23",
  "python-json-logger>=3.2,<4",
  "redis>=5.2,<6",
  "scikit-learn>=1.9.0",
  "tradegraph-data-pipeline",
  "tradegraph-ml",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "django-stubs[compatible-mypy]>=5.1,<6",
  "djangorestframework-stubs[compatible-mypy]>=3.15,<4",
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
  "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/data_pipeline",
    "packages/ml",
]

[tool.uv.sources]
tradegraph-data-pipeline = { workspace = true, editable = true }
tradegraph-ml = { workspace = true, editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/frontend", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["apps/backend", "packages/data_pipeline/src", "packages/ml/src"]
testpaths = ["apps/backend/tests", "packages/data_pipeline/tests", "packages/ml/tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
mypy_path = "apps/backend,packages/data_pipeline/src,packages/ml/src"
exclude = ["apps/frontend"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "pyarrow", "pyarrow.*", "joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["catalog.filters"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

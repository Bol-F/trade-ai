[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradegraph-data-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polars>=1.30,<2",
  "pyarrow>=23.0.1,<24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradegraph_data_pipeline"]

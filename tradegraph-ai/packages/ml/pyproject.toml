[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradegraph-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "polars>=1.30,<2",
  "scikit-learn>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradegraph_ml"]
